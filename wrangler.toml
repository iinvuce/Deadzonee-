name = "dovy-deadzone"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# No database_id on purpose: Wrangler 4 auto-provisions D1 on first deploy.
[[d1_databases]]
binding = "DB"

[durable_objects]
bindings = [
  { name = "COOP", class_name = "CoopHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoopHub"]
